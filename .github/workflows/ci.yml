# CI: setiap push ke main dan setiap pull request, GitHub menjalanka unit test.
# lint SQL, lalu seluruh pipeline (partisi -> load raw -> dbt build) di atas sample data
# kecil (tests/fixtures/olist_sample) dan PostgreSQL sementara.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # tombol "Run workflow" di tab Actions

jobs:
  pipeline:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    # Warehouse sementara: dibuat saat job mulai dan dihapus saat job selesai
    services:
      warehouse:
        image: postgres:18
        env:
          POSTGRES_DB: olist_dw
          POSTGRES_USER: olist
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U olist -d olist_dw"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Pengganti .env di CI. Password ini bukan rahasia: hanya berlaku untuk database
    # sementara di atas, yang tidak bisa diakses dari luar dan hilang setelah job selesai.
    env:
      WAREHOUSE_HOST: localhost
      WAREHOUSE_PORT: "5432"
      WAREHOUSE_DB: olist_dw
      WAREHOUSE_USER: olist
      WAREHOUSE_PASSWORD: ci_only_password
      DBT_USE_COLORS: "false"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Unit tests (pytest)
        run: python -m pytest -v
      
      - name: Create warehouse schemas
        run: psql -h localhost -U olist -d olist_dw -v ON_ERROR_STOP=1 -f warehouse/init/01_create_schemas.sql
        env:
          PGPASSWORD: ci_only_password
      
      - name: Lint SQL (sqlfluff)
        run: sqlfluff lint dbt/olist/models dbt/olist/tests

      - name: Load sample data into raw
        run: |
          mkdir -p data/source
          cp tests/fixtures/olist_sample/*.csv data/source/
          python -m ingestion.partition --all
          python -m ingestion.load_raw --all

      - name: dbt build
        working-directory: dbt/olist
        run: dbt build

      # Jalankan ulang satu bulan, persis seperti rerun di Airflow. Ini menguji jalur
      # incremental fct_orders (is_incremental() = true) yang tidak tersentuh build pertama.

      - name: Rerun one month (incremental month)
        run: |
          python -m ingestion.load_raw --month 2017-11
          cd dbt/olist && dbt build --select fct_orders*