# Cara dbt terhubung ke warehouse. Semua nilai dibaca dari environment variable
# (dbt 1.12 membaca .env di root repo secara otomatis), jadi tidak ada password di file ini.

olist:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('WAREHOUSE_HOST') }}"
      port: "{{ env_var('WAREHOUSE_PORT') | as_number }}"
      dbname: "{{ env_var('WAREHOUSE_DB') }}"
      user: "{{ env_var('WAREHOUSE_USER') }}"
      password: "{{ env_var('WAREHOUSE_PASSWORD') }}"
      schema: staging
      threads: 4
